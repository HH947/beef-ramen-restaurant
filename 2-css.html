<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나를 소개합니다!</title>
    <style>
        /* 기본 리셋 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 
           포스터 속 사람들이 잘리지 않고 모두 보이도록
           배경을 contain(비율 유지 전체 표시)으로 설정하고 고정
        */
        html {
            min-height: 100%;
            background-color: #120907; /* 포스터 테두리와 어울리는 딥 버건디/블랙 */
            background-image: url('bg.png');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: contain;
            background-attachment: fixed;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', sans-serif;
            color: #ffffff;
        }

        /* 
           메인 카드: 포스터 속 사람들이 훤히 들여다보이도록
           맑고 투명한 다크 글래스모피즘 적용
        */
        body {
            max-width: 520px;
            margin: 30px auto 100px auto;
            padding: 30px 24px;
            background: rgba(20, 10, 8, 0.65); /* 은은한 반투명으로 뒤의 인물들이 보임 */
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 20px;
            border: 1px solid rgba(255, 220, 180, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: opacity 0.3s ease, background 0.3s ease;
        }

        /* 카드에 마우스를 올리면 더 투명해져서 배경 속 인물들이 한눈에 훤히 보임 */
        body:hover {
            background: rgba(20, 10, 8, 0.4);
        }

        /* 메인 제목 */
        h1 {
            font-size: 1.8rem;
            color: #ffb74d; /* 포스터 타이틀 느낌의 따뜻한 골드 옐로우 */
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* 구분선 */
        hr {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 183, 77, 0.4), transparent);
            margin: 20px 0;
        }

        /* 소제목 */
        h2 {
            font-size: 1.2rem;
            color: #ffe0b2;
            margin-bottom: 12px;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        /* 문단 텍스트 */
        p {
            line-height: 1.6;
            font-size: 1.02rem;
            color: #f5f5f5;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        /* 내 사진 (김하율 프로필 사진) */
        p img {
            display: block;
            margin: 12px auto;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top; /* 얼굴 위치에 맞춤 */
            border: 3px solid rgba(255, 183, 77, 0.85); /* 골드 테두리 */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        p img:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 30px rgba(255, 183, 77, 0.4);
        }

        /* 기본 정보 강조 */
        p strong {
            color: #ffb74d;
            font-weight: 700;
        }

        /* 순서 목록 (이상형, 게임 목록) */
        ol {
            list-style-position: inside;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        ol li {
            padding: 8px 6px;
            font-size: 0.98rem;
            color: #f0f0f0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            transition: padding-left 0.2s ease, color 0.2s ease;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }

        ol li:last-child {
            border-bottom: none;
        }

        ol li:hover {
            padding-left: 8px;
            color: #ffb74d;
            font-weight: 600;
        }

        /* 하단 마무리 인사 */
        body > p:last-child {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffb74d;
            margin-top: 10px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        /* 핸드폰(모바일) 최적화 */
        @media (max-width: 640px) {
            html {
                background-size: 100% auto; /* 모바일 화면 너비에 딱 맞게 표시되어 사람들이 전부 보임 */
            }

            body {
                margin: 16px 12px 80px 12px;
                padding: 22px 16px;
                border-radius: 16px;
                background: rgba(20, 10, 8, 0.7); /* 모바일에서도 시원하게 투과 */
            }

            h1 {
                font-size: 1.5rem;
            }

            h2 {
                font-size: 1.1rem;
            }

            p img {
                width: 170px;
                height: 170px;
            }

            ol li {
                font-size: 0.92rem;
            }
        }
    </style>
</head>
<body>
    <h1>👋 나를 소개합니다!</h1>
    <hr>

    <!-- 사진 들어갈 자리 -->
    <h2>📷 내 사진</h2>
    <p>
        <img src="profile.jpg" alt="김하율 프로필 사진" width="200" height="200">
    </p>

    <hr>

    <!-- 이름 -->
    <h2>👤 기본 정보</h2>
    <p><strong>이름:</strong> 김하율</p>

    <hr>

    <!-- 선호하는 이상형 3가지 -->
    <h2>💖 내가 선호하는 이상형 3가지</h2>
    <ol>
        <li>까무잡잡한 사람</li>
        <li>잘 웃는 사람</li>
        <li>귀여운 사람</li>
    </ol>

    <hr>

    <!-- 좋아하는 게임 3가지 -->
    <h2>🎮 내가 좋아하는 게임 3가지</h2>
    <ol>
        <li>리그 오브 레전드</li>
        <li>피파</li>
        <li>인왕3</li>
    </ol>

    <hr>

    <p>잘 부탁해 친구들아! 😊</p>
</body>
</html>
