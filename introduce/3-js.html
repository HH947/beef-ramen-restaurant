<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나를 소개합니다!</title>
    <style>
        /* 기본 리셋 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 
           포스터 속 사람들이 잘리지 않고 모두 보이도록
           배경을 contain(비율 유지 전체 표시)으로 설정하고 고정
        */
        html {
            min-height: 100%;
            background-color: #120907; /* 포스터 테두리와 어울리는 딥 버건디/블랙 */
            background-image: url('bg.png');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: contain;
            background-attachment: fixed;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', sans-serif;
            color: #ffffff;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 
           메인 카드: 포스터 속 사람들이 훤히 들여다보이도록
           맑고 투명한 다크 글래스모피즘 적용
        */
        body {
            position: relative;
            max-width: 520px;
            margin: 30px auto 100px auto;
            padding: 30px 24px;
            background: rgba(20, 10, 8, 0.65); /* 은은한 반투명으로 뒤의 인물들이 보임 */
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 20px;
            border: 1px solid rgba(255, 220, 180, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: opacity 0.3s ease, background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        /* 카드에 마우스를 올리면 더 투명해져서 배경 속 인물들이 한눈에 훤히 보임 */
        body:hover {
            background: rgba(20, 10, 8, 0.4);
        }

        /* 상단 컨트롤 바 (테마 토글 버튼) */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 183, 77, 0.4);
            color: #ffb74d;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            transition: all 0.25s ease;
        }

        .theme-toggle-btn:hover {
            background: rgba(255, 183, 77, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 183, 77, 0.3);
        }

        /* ================= 음악 플레이어 (Il Mondo BGM) ================= */
        .music-player {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 183, 77, 0.3);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 18px;
            backdrop-filter: blur(6px);
            transition: all 0.3s ease;
        }

        /* LP 디스크 애니메이션 */
        .lp-disk {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffb74d 18%, #111 20%, #222 45%, #111 50%, #222 75%, #111 100%);
            border: 2px solid rgba(255, 183, 77, 0.8);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .lp-disk.playing {
            animation: spinRecord 3.5s linear infinite;
        }

        @keyframes spinRecord {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .music-info {
            flex: 1;
            overflow: hidden;
        }

        .music-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffb74d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .music-artist {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2px;
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .play-toggle-btn {
            background: linear-gradient(135deg, #ffb74d, #f57c00);
            border: none;
            color: #2c1609;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(245, 124, 0, 0.4);
            transition: transform 0.2s, filter 0.2s;
        }

        .play-toggle-btn:hover {
            transform: scale(1.08);
            filter: brightness(1.1);
        }

        /* 메인 제목 */
        h1 {
            font-size: 1.8rem;
            color: #ffb74d; /* 포스터 타이틀 느낌의 따뜻한 골드 옐로우 */
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* 구분선 */
        hr {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 183, 77, 0.4), transparent);
            margin: 20px 0;
        }

        /* 소제목 */
        h2 {
            font-size: 1.2rem;
            color: #ffe0b2;
            margin-bottom: 12px;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        /* 문단 텍스트 */
        p {
            line-height: 1.6;
            font-size: 1.02rem;
            color: #f5f5f5;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        /* 내 사진 (김하율 프로필 사진) */
        p img {
            display: block;
            margin: 12px auto;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top; /* 얼굴 위치에 맞춤 */
            border: 3px solid rgba(255, 183, 77, 0.85); /* 골드 테두리 */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        p img:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 30px rgba(255, 183, 77, 0.4);
        }

        /* 기본 정보 강조 */
        p strong {
            color: #ffb74d;
            font-weight: 700;
        }

        /* 순서 목록 (이상형, 게임 목록) */
        ol {
            list-style-position: inside;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        ol li {
            padding: 8px 6px;
            font-size: 0.98rem;
            color: #f0f0f0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            transition: padding-left 0.2s ease, color 0.2s ease;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }

        ol li:last-child {
            border-bottom: none;
        }

        ol li:hover {
            padding-left: 8px;
            color: #ffb74d;
            font-weight: 600;
        }

        /* 하단 마무리 인사 */
        .farewell {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffb74d;
            margin: 15px 0 5px 0;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        /* ================= 방명록(댓글) 스타일 ================= */
        .guestbook-section {
            margin-top: 15px;
        }

        .guestbook-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.35);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 16px;
        }

        .guestbook-form input,
        .guestbook-form textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .guestbook-form input::placeholder,
        .guestbook-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .guestbook-form input:focus,
        .guestbook-form textarea:focus {
            border-color: #ffb74d;
            background: rgba(255, 255, 255, 0.18);
        }

        .guestbook-form textarea {
            resize: vertical;
            min-height: 60px;
        }

        .guestbook-form button {
            align-self: flex-end;
            background: linear-gradient(135deg, #ffb74d, #f57c00);
            color: #2c1609;
            border: none;
            padding: 9px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
        }

        .guestbook-form button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 4px 12px rgba(245, 124, 0, 0.4);
        }

        /* 댓글 리스트 */
        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .comments-list::-webkit-scrollbar {
            width: 6px;
        }
        .comments-list::-webkit-scrollbar-thumb {
            background: rgba(255, 183, 77, 0.4);
            border-radius: 4px;
        }

        .comment-item {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .comment-author {
            font-weight: 700;
            color: #ffb74d;
            font-size: 0.92rem;
        }

        .comment-date {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-right: 8px;
        }

        .comment-delete-btn {
            background: none;
            border: none;
            color: #ff8a80;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .comment-delete-btn:hover {
            background: rgba(255, 82, 82, 0.2);
        }

        .comment-text {
            font-size: 0.92rem;
            color: #f0f0f0;
            line-height: 1.45;
            word-break: break-all;
            white-space: pre-wrap;
            text-shadow: none;
        }

        .empty-comments {
            text-align: center;
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.5);
            padding: 16px 0;
        }

        /* ================= 라이트 모드 테마 스타일 ================= */
        body.light-mode {
            background: rgba(255, 253, 250, 0.92);
            color: #2c2523;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        body.light-mode:hover {
            background: rgba(255, 253, 250, 0.75);
        }

        body.light-mode .music-player {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(138, 31, 29, 0.25);
            box-shadow: 0 4px 15px rgba(138, 31, 29, 0.1);
        }

        body.light-mode .music-title {
            color: #8a1f1d;
        }

        body.light-mode .music-artist {
            color: #6d5b54;
        }

        body.light-mode .play-toggle-btn {
            background: linear-gradient(135deg, #a72826, #8a1f1d);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(138, 31, 29, 0.3);
        }

        body.light-mode h1 {
            color: #8a1f1d;
            text-shadow: none;
        }

        body.light-mode hr {
            background: linear-gradient(to right, transparent, rgba(138, 31, 29, 0.25), transparent);
        }

        body.light-mode h2 {
            color: #3e2723;
            text-shadow: none;
        }

        body.light-mode p {
            color: #443c39;
            text-shadow: none;
        }

        body.light-mode p strong {
            color: #8a1f1d;
        }

        body.light-mode p img {
            border-color: #fff;
            box-shadow: 0 8px 20px rgba(138, 31, 29, 0.2);
        }

        body.light-mode ol {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(220, 200, 190, 0.5);
        }

        body.light-mode ol li {
            color: #3b322f;
            border-bottom: 1px dashed rgba(200, 180, 170, 0.4);
            text-shadow: none;
        }

        body.light-mode ol li:hover {
            color: #8a1f1d;
        }

        body.light-mode .farewell {
            color: #8a1f1d;
            text-shadow: none;
        }

        body.light-mode .theme-toggle-btn {
            background: rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(138, 31, 29, 0.3);
            color: #8a1f1d;
        }

        body.light-mode .theme-toggle-btn:hover {
            background: rgba(138, 31, 29, 0.15);
            box-shadow: 0 4px 12px rgba(138, 31, 29, 0.2);
        }

        body.light-mode .guestbook-form {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(220, 200, 190, 0.6);
        }

        body.light-mode .guestbook-form input,
        body.light-mode .guestbook-form textarea {
            background: #ffffff;
            color: #2c2523;
            border: 1px solid rgba(200, 180, 170, 0.6);
        }

        body.light-mode .guestbook-form input::placeholder,
        body.light-mode .guestbook-form textarea::placeholder {
            color: #8c827d;
        }

        body.light-mode .guestbook-form input:focus,
        body.light-mode .guestbook-form textarea:focus {
            border-color: #8a1f1d;
        }

        body.light-mode .guestbook-form button {
            background: linear-gradient(135deg, #a72826, #8a1f1d);
            color: #ffffff;
        }

        body.light-mode .guestbook-form button:hover {
            box-shadow: 0 4px 12px rgba(138, 31, 29, 0.3);
        }

        body.light-mode .comment-item {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(220, 200, 190, 0.5);
        }

        body.light-mode .comment-author {
            color: #8a1f1d;
        }

        body.light-mode .comment-date {
            color: #8c827d;
        }

        body.light-mode .comment-text {
            color: #3b322f;
        }

        body.light-mode .empty-comments {
            color: #8c827d;
        }

        /* 유튜브 플레이어 컨테이너 (숨김 처리) */
        #youtubePlayerContainer {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* 핸드폰(모바일) 최적화 */
        @media (max-width: 640px) {
            html {
                background-size: 100% auto;
            }

            body {
                margin: 16px 12px 80px 12px;
                padding: 22px 16px;
                border-radius: 16px;
                background: rgba(20, 10, 8, 0.7);
            }

            body.light-mode {
                background: rgba(255, 253, 250, 0.94);
            }

            h1 {
                font-size: 1.5rem;
            }

            h2 {
                font-size: 1.1rem;
            }

            p img {
                width: 170px;
                height: 170px;
            }

            ol li {
                font-size: 0.92rem;
            }
        }
    </style>
</head>
<body>
    <!-- 상단 컨트롤 바 (테마 전환 버튼) -->
    <div class="top-bar">
        <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="테마 전환">
            <span id="themeIcon">☀️</span>
            <span id="themeText">라이트모드</span>
        </button>
    </div>

    <!-- 🎵 음악 플레이어 위젯 (Il Mondo) -->
    <div class="music-player">
        <div id="lpDisk" class="lp-disk" title="Il Mondo - Jimmy Fontana"></div>
        <div class="music-info">
            <div class="music-title">Il Mondo 🎶</div>
            <div class="music-artist">Jimmy Fontana · 영화 OST</div>
        </div>
        <div class="music-controls">
            <button id="playToggleBtn" class="play-toggle-btn" title="재생 / 일시정지">▶</button>
        </div>
    </div>

    <h1>👋 나를 소개합니다!</h1>
    <hr>

    <!-- 사진 들어갈 자리 -->
    <h2>📷 내 사진</h2>
    <p>
        <img src="profile.jpg" alt="김하율 프로필 사진" width="200" height="200">
    </p>

    <hr>

    <!-- 이름 -->
    <h2>👤 기본 정보</h2>
    <p><strong>이름:</strong> 김하율</p>

    <hr>

    <!-- 선호하는 이상형 3가지 -->
    <h2>💖 내가 선호하는 이상형 3가지</h2>
    <ol>
        <li>까무잡잡한 사람</li>
        <li>잘 웃는 사람</li>
        <li>귀여운 사람</li>
    </ol>

    <hr>

    <!-- 좋아하는 게임 3가지 -->
    <h2>🎮 내가 좋아하는 게임 3가지</h2>
    <ol>
        <li>리그 오브 레전드</li>
        <li>피파</li>
        <li>인왕3</li>
    </ol>

    <hr>

    <p class="farewell">잘 부탁해 친구들아! 😊</p>

    <hr>

    <!-- 방명록 / 댓글 기능 섹션 -->
    <div class="guestbook-section">
        <h2>💬 친구들의 한마디 (방명록)</h2>
        
        <!-- 댓글 작성 폼 -->
        <form id="commentForm" class="guestbook-form">
            <input type="text" id="commentAuthor" placeholder="작성자 이름 / 닉네임" required maxlength="20">
            <textarea id="commentInput" placeholder="하율이에게 응원의 한마디를 남겨줘!" required maxlength="200"></textarea>
            <button type="submit">남기기 ✨</button>
        </form>

        <!-- 댓글 목록 표시 영역 -->
        <div id="commentsList" class="comments-list">
            <!-- 자바스크립트로 댓글이 동적 렌더링됩니다 -->
        </div>
    </div>

    <!-- 숨겨진 오디오 소스 (YouTube 플레이어 & 로컬 오디오 Fallback) -->
    <div id="youtubePlayerContainer">
        <div id="ytPlayer"></div>
    </div>
    <audio id="localAudio" src="il_mondo.mp3" preload="none"></audio>

    <!-- JavaScript 로직 -->
    <script>
        /* ================= 1. 다크모드 / 라이트모드 토글 기능 ================= */
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        const body = document.body;

        const savedTheme = localStorage.getItem('hayul_theme') || 'dark';
        applyTheme(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = body.classList.contains('light-mode') ? 'light' : 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
            localStorage.setItem('hayul_theme', newTheme);
        });

        function applyTheme(theme) {
            if (theme === 'light') {
                body.classList.add('light-mode');
                themeIcon.textContent = '🌙';
                themeText.textContent = '다크모드';
            } else {
                body.classList.remove('light-mode');
                themeIcon.textContent = '☀️';
                themeText.textContent = '라이트모드';
            }
        }

        /* ================= 2. 음악 재생 기능 (Il Mondo) ================= */
        const playToggleBtn = document.getElementById('playToggleBtn');
        const lpDisk = document.getElementById('lpDisk');
        const localAudio = document.getElementById('localAudio');
        let isMusicPlaying = false;
        let ytPlayer = null;
        let isYtReady = false;

        // YouTube IFrame Player API 비동기 로드
        const ytTag = document.createElement('script');
        ytTag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(ytTag, firstScriptTag);

        // YouTube API가 준비되었을 때 호출되는 전역 콜백
        window.onYouTubeIframeAPIReady = function() {
            ytPlayer = new YT.Player('ytPlayer', {
                height: '200',
                width: '200',
                videoId: 'glivingston7', // Jimmy Fontana - Il Mondo
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'rel': 0
                },
                events: {
                    'onReady': () => { isYtReady = true; },
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        function onPlayerStateChange(event) {
            // 재생 중일 때
            if (event.data === YT.PlayerState.PLAYING) {
                setMusicPlayingUI(true);
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                setMusicPlayingUI(false);
            }
        }

        function setMusicPlayingUI(playing) {
            isMusicPlaying = playing;
            if (playing) {
                playToggleBtn.textContent = '❚❚';
                lpDisk.classList.add('playing');
            } else {
                playToggleBtn.textContent = '▶';
                lpDisk.classList.remove('playing');
            }
        }

        // 재생 / 일시정지 토글 버튼 클릭
        playToggleBtn.addEventListener('click', () => {
            if (!isMusicPlaying) {
                // 재생 시도
                if (isYtReady && ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    ytPlayer.playVideo();
                } else {
                    // YouTube API 준비 전이거나 로컬 오디오 사용 시 fallback
                    localAudio.play().then(() => {
                        setMusicPlayingUI(true);
                    }).catch(() => {
                        alert('음악 재생을 시작합니다. YouTube가 로드되면 재생됩니다!');
                    });
                }
            } else {
                // 일시 정지
                if (isYtReady && ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
                    ytPlayer.pauseVideo();
                }
                localAudio.pause();
                setMusicPlayingUI(false);
            }
        });

        // 로컬 오디오 이벤트 연동
        localAudio.addEventListener('ended', () => setMusicPlayingUI(false));
        localAudio.addEventListener('pause', () => {
            if (!isYtReady) setMusicPlayingUI(false);
        });

        /* ================= 3. 방명록 / 댓글 기능 (localStorage 영구 저장) ================= */
        const commentForm = document.getElementById('commentForm');
        const commentAuthor = document.getElementById('commentAuthor');
        const commentInput = document.getElementById('commentInput');
        const commentsList = document.getElementById('commentsList');

        const defaultComments = [
            {
                id: 1,
                author: '친구1',
                text: '하율아 웹페이지 배경 대박이다 ㅋㅋㅋ 피파 한판 고?',
                date: '2026. 10. 14.'
            },
            {
                id: 2,
                author: '롤메이트',
                text: '인왕3 언제 할거임? 롤도 듀오 돌리자!',
                date: '2026. 10. 14.'
            }
        ];

        function getComments() {
            const stored = localStorage.getItem('hayul_comments');
            if (!stored) {
                localStorage.setItem('hayul_comments', JSON.stringify(defaultComments));
                return defaultComments;
            }
            try {
                return JSON.parse(stored);
            } catch (e) {
                return [];
            }
        }

        function saveComments(comments) {
            localStorage.setItem('hayul_comments', JSON.stringify(comments));
        }

        function getCurrentFormattedDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${year}. ${month}. ${day}. ${hours}:${minutes}`;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderComments() {
            const comments = getComments();
            commentsList.innerHTML = '';

            if (comments.length === 0) {
                commentsList.innerHTML = '<p class="empty-comments">아직 등록된 한마디가 없어요. 첫 번째로 글을 남겨보세요! ✨</p>';
                return;
            }

            comments.forEach((comment) => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <div class="comment-header">
                        <span class="comment-author">👤 ${escapeHtml(comment.author)}</span>
                        <div>
                            <span class="comment-date">${escapeHtml(comment.date)}</span>
                            <button class="comment-delete-btn" onclick="deleteComment(${comment.id})" title="삭제">✕</button>
                        </div>
                    </div>
                    <div class="comment-text">${escapeHtml(comment.text)}</div>
                `;
                commentsList.appendChild(item);
            });
        }

        commentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const author = commentAuthor.value.trim();
            const text = commentInput.value.trim();

            if (!author || !text) return;

            const comments = getComments();
            const newComment = {
                id: Date.now(),
                author: author,
                text: text,
                date: getCurrentFormattedDate()
            };

            comments.unshift(newComment);
            saveComments(comments);
            renderComments();

            commentInput.value = '';
            commentAuthor.value = '';
        });

        window.deleteComment = function(id) {
            if (!confirm('이 댓글을 삭제하시겠습니까?')) return;
            let comments = getComments();
            comments = comments.filter(c => c.id !== id);
            saveComments(comments);
            renderComments();
        };

        renderComments();
    </script>
</body>
</html>
